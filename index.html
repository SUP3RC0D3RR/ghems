<!DOCTYPE html>
<html lang="en">  
<head>
    <!-- Import Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Luxurious+Roman&display=swap" rel="stylesheet">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K1ngGames</title>
    <style>
        /* Apply Luxurious Roman font */
        body {
            font-family: 'Luxurious Roman', serif;
            text-align: center;
            margin: 50px;
            background-color: #000000;
            color: white; /* Ensure text is visible on black background */
        }
        header {
            font-size: 24px;
            font-weight: bold;
        }
        .frocking-text {
            color: white; /* Example styling for header */
        }
        footer {
            margin-top: 20px;
            font-size: 14px;
            color: gray;
        }


        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }


        .game-button {
            font-family: 'Luxurious Roman', serif;
            font-size: 18px;
            padding: 15px 30px;
            background-color: #ffffff;
            color: black;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }


        .game-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(100, 100, 100, 100);
        }


        .game-button:active {
            transform: translateY(0);
            box-shadow: none;
        }
    </style>
</head>
